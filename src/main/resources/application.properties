spring.application.name=spring-ai-workshop

# Your Gemini API Key from Google AI Studio
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# Recommended Model for Free Tier
# Note: As of Dec 2025, gemini-1.5-flash is still reliable,
# but gemini-2.0-flash is often the default for new projects.
spring.ai.google.genai.chat.options.model=${GEMINI_API_MODEL}
# Optional: Adjust creativity
spring.ai.google.genai.chat.options.temperature=0.7

# --- CRITICAL ADDITIONS FOR FREE TIER ---
# 1. Enable retries to handle 429 (Rate Limit) errors gracefully
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=2s
spring.ai.retry.on-http-codes=429
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=30s
# Important: ensure it retries on 429 errors
spring.ai.retry.on-client-errors=true