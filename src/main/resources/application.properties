spring.application.name=spring-ai-workshop

# Your Gemini API Key from Google AI Studio
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# Explicitly satisfying the Embedding connection properties
# extracted from your decompiled code
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.project-id=workshop-project
spring.ai.google.genai.embedding.location=us-central1

# Connection to the ES Cluster
spring.elasticsearch.uris=http://localhost:9200
#spring.elasticsearch.username=ai_app_user
#spring.elasticsearch.password=secure_password
# The name of the index to store your bank data vectors

# Crucial: Tell Spring AI to create the index if it doesn't exist
spring.ai.vectorstore.elasticsearch.initialize-schema=true
# Vector Store specific settings
spring.ai.vectorstore.elasticsearch.index-name=customer-policy-vectors
spring.ai.vectorstore.elasticsearch.dimensions=768
spring.ai.vectorstore.elasticsearch.similarity=cosine

# Kafka properties
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=pc-bank-rag-group
spring.kafka.consumer.auto-offset-reset=earliest

# 1. Use ErrorHandlingDeserializer as the main deserializer
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

# 2. Delegate deserializers
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# 3. JSON deserialization configuration
spring.kafka.consumer.properties.spring.json.value.default.type=com.sri.spring_ai_workshop.model.PolicyUpdate
spring.kafka.consumer.properties.spring.json.trusted.packages=com.sri.spring_ai_workshop.rag

# Recommended Model for Free Tier
# Note: As of Dec 2025, gemini-1.5-flash is still reliable,
# but gemini-2.0-flash is often the default for new projects.
spring.ai.google.genai.chat.options.model=${GEMINI_API_MODEL}
# Optional: Adjust creativity
spring.ai.google.genai.chat.options.temperature=0.7

# --- CRITICAL ADDITIONS FOR FREE TIER ---
# 1. Enable retries to handle 429 (Rate Limit) errors gracefully
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=2s
spring.ai.retry.on-http-codes=429
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=30s
# Important: ensure it retries on 429 errors
spring.ai.retry.on-client-errors=true